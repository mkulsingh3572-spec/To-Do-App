<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mukul's To-Do App</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <!-- Header -->

    <header>

    <button id="themeBtn" title="Toggle Theme">
        🌙
    </button>

    <h1>Mukul's To-Do App</h1>

    <p class="subtitle">
        Organize Smarter. Achieve More.
    </p>

</header>

    <!-- Main Container -->

    <div class="container">

        <!-- Date + Counter -->

        <div class="top-info">

            <p id="currentDate"></p>

            <div class="task-counter">

                <span id="taskCount">0</span> Tasks

            </div>

       </div>

<div class="progress-section">

    <div class="progress-header">

        <span>Today's Progress</span>

        <span id="progressText">0%</span>

    </div>

    <div class="progress-bar">

        <div id="progressFill"></div>

    </div>

    <p id="progressStatus">
        0 / 0 Tasks Completed
    </p>

</div>

<!-- Statistics Dashboard -->

<div class="stats-section">

    <div class="stat-card">
        <div class="stat-icon">📋</div>
        <h2 id="totalTasks">0</h2>
        <p>Total Tasks</p>
    </div>

    <div class="stat-card">
        <div class="stat-icon">✅</div>
        <h2 id="completedTasks">0</h2>
        <p>Completed</p>
    </div>

    <div class="stat-card">
        <div class="stat-icon">⏳</div>
        <h2 id="pendingTasks">0</h2>
        <p>Pending</p>
    </div>

    <div class="stat-card">
        <div class="stat-icon">📈</div>
        <h2 id="completionRate">0%</h2>
        <p>Success Rate</p>
    </div>

</div>

<!-- Todo Card -->

<div class="todo-app">

            <!-- Input -->

            <div class="input-section">

    <input
        type="text"
        id="taskInput"
        placeholder="Enter a new task...">

    <select id="priority" title="Task Priority">
    <option value="High">🔴 HIGH</option>
    <option value="Medium" selected>🟡 MEDIUM</option>
    <option value="Low">🟢 LOW</option>
</select>

<select id="category" title="Task Category">
    <option value="Study">📚 Study</option>
    <option value="Work">💼 Work</option>
    <option value="Personal" selected>🏠 Personal</option>
    <option value="Fitness">🏋️ Fitness</option>
</select>

<input
    type="date"
    id="dueDate"
    title="Due Date">

    <button id="addTask" title="Add Task">
        <i class="fa-solid fa-plus"></i>
    </button>

</div>

           <!-- Search -->

<div class="search-section" id="searchSection">

    <input
        type="text"
        id="searchTask"
        placeholder="Search tasks...">

</div>

<!-- Filters -->

<div class="filter-section">

    <button class="filter-btn active" data-filter="all">
        All
    </button>

    <button class="filter-btn" data-filter="active">
        Active
    </button>

    <button class="filter-btn" data-filter="completed">
        Completed
    </button>

</div>

<!-- Task List -->

<ul id="taskList">

</ul>
        </div>

    </div>


    <!-- JavaScript -->
     <div id="toast">

    <span id="toastMessage"></span>

    <button id="undoBtn">UNDO</button>

</div>
    <script src="script.js"></script>

</body>
</html>
